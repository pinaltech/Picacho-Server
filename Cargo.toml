[package]
name = "picacho-server"
version = "0.1.0"
edition = "2021"
description = "Picacho Server: a secure, fast IMAP/SMTP mail server with a web postmaster console"
license = "MIT"
default-run = "picacho-server"

[[bin]]
name = "picacho-server"
path = "src/main.rs"

[lib]
name = "picacho_server"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "form", "tokio", "matched-path"] }
tower-http = { version = "0.6", features = ["set-header", "compression-gzip", "limit"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tower = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite", "postgres", "migrate"] }
object_store = { version = "0.12", default-features = false, features = ["aws"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "webpki-roots", "pool"] }
mail-auth = { version = "0.15", default-features = false, features = ["dns-hickory", "rust-crypto", "generate", "arc"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config", "dnssec-ring"] }
webpki-roots = "1"
quick-xml = "0.37"
async-compression = { version = "0.4", features = ["tokio", "deflate"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
rrule = "0.13"
regex = "1"
chrono-tz = "0.9"
mail-parser = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
subtle = "2.6"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
x509-parser = "0.16"
dashmap = "6"
parking_lot = "0.12"
thiserror = "2"
anyhow = "1"
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
# Zero-access mail (src/za.rs): Pinal's za.js formats.
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
